name: Reusable Deploy
on:
  workflow_call:
    inputs:
      artifact-name:
        description: The name of the artifact to download.
        required: false
        default: dist
        type: string
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
      - name: List downloaded files
        run: ls -la
      - name: Deploy
        run: echo "Deploying project..."
